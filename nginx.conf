worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    
    # Resolver for dynamic DNS resolution in Docker
    resolver 127.0.0.11 valid=30s;

    server {
        listen 9000;

        # -------- REACT FRONTEND ----------
        location / {
            set $frontend "frontend-service:8080";
            proxy_pass http://$frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------- BACKEND API --------------
        location /backend/ {
            set $backend "backend-service:8040";
            # Remove /backend prefix when proxying to backend
            rewrite ^/backend/(.*)$ /$1 break;
            proxy_pass http://$backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # -------- MBTI Service -------------
        location /mbti/ {
            set $mbti "mbti-service:8010";
            proxy_pass http://$mbti/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            rewrite ^/mbti/?(.*)$ /$1 break;
        }

        # -------- Kundali Service ----------
        location /kundali/ {
            set $kundali "kundali-service:8000";
            proxy_pass http://$kundali/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            rewrite ^/kundali/?(.*)$ /$1 break;
        }

        # -------- SQLite Service -----------
        location /sqlite/ {
            set $sqlite "sql-service:8030";
            proxy_pass http://$sqlite/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            rewrite ^/sqlite/?(.*)$ /$1 break;
        }
    }
}